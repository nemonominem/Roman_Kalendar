name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files to be uploaded (diagnostic)
        run: |
          echo "PWD: $(pwd)"
          echo "Listing repository root (showing whether index.html is present):"
          ls -la .
          echo "Recursive listing (first 200 lines):"
          ls -laR . | sed -n '1,200p'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Change this if your site files are in a subfolder, e.g. 'docs/'
          path: './'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
